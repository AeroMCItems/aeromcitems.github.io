<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Amity Micup Application — Micup topluluğu için geliştirilen bot."
    />
    <title>Amity Micup Application</title>
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" href="./favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=2" />

    <style>
      @font-face {
        font-family: "Amity";
        src: url("./font-primary-regular.otf") format("opentype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      @font-face {
        font-family: "Amity";
        src: url("./font-primary-bold.otf") format("opentype");
        font-style: normal;
        font-weight: 700;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        font-family: "Amity", system-ui, sans-serif;
        background-color: #101010;
        color: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        background-color: #101010;
        background-image: url("./basic_background.png");
        background-repeat: repeat;
        background-position: top left;
        overflow-x: hidden;
      }

      .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
      }

      .brand {
        display: block;
        width: min(525px, 86vw);
        height: auto;
        image-rendering: pixelated;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.45));
      }

      .message-box {
        width: min(720px, 100%);
        min-height: 128px;
        margin: clamp(2rem, 6vh, 4.5rem) auto 0;
        padding: clamp(0.9rem, 2.5vw, 1.4rem) clamp(1.5rem, 4vw, 3rem);
        display: grid;
        place-items: center;
        border: 8px solid transparent;
        /* Original 8px corners; the middle strips are exactly 1px and repeat. */
        border-image-source: url("./assets/button-box-slice.png");
        border-image-slice: 8 fill;
        border-image-width: 8px;
        border-image-repeat: repeat;
        image-rendering: pixelated;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.42);
        text-align: center;
      }

      .message {
        margin: 0;
        color: #ffffff;
        font-size: clamp(1.1rem, 2.5vw, 1.55rem);
        font-weight: 400;
        line-height: 1.55;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.55);
      }

      @media (max-width: 480px) {
        .message-box {
          padding: 1rem 1.25rem;
        }

        .message {
          font-size: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <img
        class="brand"
        src="./amity_color_transparent.png"
        alt="Amity"
        width="525"
        height="102"
      />

      <section class="message-box" aria-label="Uygulama durumu">
        <p class="message">
          Micup topluluğunuz için geliştirilen bu bot, şu an geliştirilme
          aşamasındadır.
        </p>
      </section>
    </main>
  </body>
</html>
